name: Generate Snake Animation

on:
  schedule:
    # Run once every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff5ca8&color_dots=#0b0b0d,#17171c,#2f3dff,#5764ff,#d6daff
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff5ca8&color_dots=#0b0b0d,#17171c,#2f3dff,#5764ff,#d6daff

      - name: Deploy to GitHub Pages or Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
