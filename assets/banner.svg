<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 34px; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-weight: 500; font-size: 15px; fill: #94a3b8; letter-spacing: 0.2px; }
    .highlight { font-weight: 600; fill: #38bdf8; }
    .prompt { font-weight: 500; font-size: 13px; fill: #a5b4fc; }
    .tag { font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .badge-txt { font-size: 11px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle glow accents in background -->
  <circle cx="120" cy="60" r="80" fill="#38bdf8" opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="800" cy="220" r="100" fill="#c084fc" opacity="0.08" filter="url(#soft-glow)" />

  <!-- Top Window Header Bar -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 882 2 C 890.84 2 898 9.16 898 18 L 898 42 L 2 42 Z" fill="#0b1120" />
  <line x1="2" y1="42" x2="898" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="26" cy="22" r="5.5" fill="#f43f5e" opacity="0.9" />
  <circle cx="44" cy="22" r="5.5" fill="#fbbf24" opacity="0.9" />
  <circle cx="62" cy="22" r="5.5" fill="#10b981" opacity="0.9" />

  <!-- Window Title -->
  <text x="450" y="26" text-anchor="middle" class="mono" font-size="12" fill="#64748b" font-weight="500">h3x-levi ~ akshay-mondal // zsh</text>

  <!-- Live Status Pill (Top Right) -->
  <rect x="730" y="12" width="146" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="744" cy="23" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="756" y="26" class="mono badge-txt" font-size="10.5">OPS &amp; RELEASE READY</text>

  <!-- Main Content Body -->
  <!-- Name / Title -->
  <text x="46" y="98" class="sans title">Akshay Mondal</text>
  <text x="320" y="96" class="mono" font-size="14" fill="#64748b">(@h3x-levi)</text>

  <!-- Primary Headline -->
  <text x="46" y="128" class="sans subtitle">
    Support Engineer II at <tspan fill="#f1f5f9" font-weight="600">Amazon Luna</tspan> <tspan fill="#475569">•</tspan> Bengaluru, India
  </text>

  <!-- Bio statement -->
  <text x="46" y="156" class="sans subtitle" fill="#cbd5e1" font-size="14">
    Running live operations for cloud gaming &amp; engineering native tools end-to-end:
  </text>
  <text x="46" y="178" class="sans subtitle" fill="#94a3b8" font-size="13.5">
    Native macOS Assistants (Swift) <tspan fill="#475569">|</tspan> Serverless AI Pipelines (AWS) <tspan fill="#475569">|</tspan> On-Device Intelligence &amp; SRE
  </text>

  <!-- Terminal Command Prompt Line -->
  <rect x="46" y="204" width="808" height="48" rx="10" fill="#050811" stroke="#1e293b" stroke-width="1" />
  <text x="64" y="233" class="mono prompt">
    <tspan fill="#10b981">➜</tspan> <tspan fill="#38bdf8">~</tspan> <tspan fill="#64748b">shipped</tspan> <tspan fill="#f8fafc">--show-featured</tspan>
  </text>
  <text x="290" y="233" class="mono" font-size="12" fill="#94a3b8">
    [<tspan fill="#38bdf8">Olivia</tspan>, <tspan fill="#818cf8">Signal</tspan>, <tspan fill="#c084fc">StepWise</tspan>, <tspan fill="#34d399">Talaria</tspan>, <tspan fill="#f472b6">Bharat Wallet</tspan>]
  </text>
</svg>
