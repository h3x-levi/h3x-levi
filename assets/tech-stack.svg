<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <filter id="stack-shadow" x="-8%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#060a5c" flood-opacity="0.45" />
    </filter>

    <linearGradient id="rim-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(214, 218, 255, 0.4)" />
      <stop offset="40%" stop-color="rgba(47, 61, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-feature-settings: "tnum" 1; }
    
    .stack-title { font-size: 14px; font-weight: 750; fill: #f3f3f1; letter-spacing: -0.2px; }
    .stack-sub { font-size: 10px; font-weight: 600; fill: #d6daff; letter-spacing: 0.5px; }
    .tag-txt { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Row of 4 Cards (Width 224 each, Gap 14) -->

  <!-- Card 1: Languages -->
  <g transform="translate(10, 8)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="224" height="232" rx="20" fill="#0b0b0d" stroke="url(#rim-stack)" stroke-width="1.2" />
    
    <text x="18" y="32" class="mono stack-sub">01 // CODE</text>
    <text x="18" y="56" class="sans stack-title">Languages I Write</text>

    <!-- Tag 1: Python -->
    <rect x="18" y="74" width="88" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="87" r="4" fill="#38bdf8" />
    <text x="40" y="91" class="sans tag-txt" fill="#f8fafc">Python</text>

    <!-- Tag 2: Swift -->
    <rect x="114" y="74" width="90" height="26" rx="13" fill="#1e293b" />
    <circle cx="126" cy="87" r="4" fill="#f97316" />
    <text x="136" y="91" class="sans tag-txt" fill="#f8fafc">Swift</text>

    <!-- Tag 3: TypeScript -->
    <rect x="18" y="108" width="108" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="121" r="4" fill="#60a5fa" />
    <text x="40" y="125" class="sans tag-txt" fill="#f8fafc">TypeScript</text>

    <!-- Tag 4: Kotlin -->
    <rect x="134" y="108" width="72" height="26" rx="13" fill="#1e293b" />
    <circle cx="146" cy="121" r="4" fill="#a855f7" />
    <text x="156" y="125" class="sans tag-txt" fill="#f8fafc">Kotlin</text>

    <!-- Tag 5: Dart -->
    <rect x="18" y="142" width="76" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="155" r="4" fill="#38bdf8" />
    <text x="40" y="159" class="sans tag-txt" fill="#f8fafc">Dart</text>

    <!-- Tag 6: JavaScript -->
    <rect x="102" y="142" width="102" height="26" rx="13" fill="#1e293b" />
    <circle cx="114" cy="155" r="4" fill="#facc15" />
    <text x="124" y="159" class="sans tag-txt" fill="#f8fafc">JavaScript</text>

    <!-- Tag 7: Bash & Shell -->
    <rect x="18" y="176" width="98" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="189" r="4" fill="#4ade80" />
    <text x="40" y="193" class="sans tag-txt" fill="#f8fafc">Bash / Zsh</text>
  </g>

  <!-- Card 2: Cloud & Serverless (AWS) -->
  <g transform="translate(248, 8)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="224" height="232" rx="20" fill="#0b0b0d" stroke="url(#rim-stack)" stroke-width="1.2" />
    
    <text x="18" y="32" class="mono stack-sub">02 // CLOUD</text>
    <text x="18" y="56" class="sans stack-title">AWS Serverless</text>

    <!-- Tag 1: Lambda -->
    <rect x="18" y="74" width="112" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="87" r="4" fill="#f97316" />
    <text x="40" y="91" class="sans tag-txt" fill="#f8fafc">AWS Lambda</text>

    <!-- Tag 2: Bedrock -->
    <rect x="18" y="108" width="126" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="121" r="4" fill="#c084fc" />
    <text x="40" y="125" class="sans tag-txt" fill="#f8fafc">Amazon Bedrock</text>

    <!-- Tag 3: DynamoDB -->
    <rect x="18" y="142" width="104" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="155" r="4" fill="#818cf8" />
    <text x="40" y="159" class="sans tag-txt" fill="#f8fafc">DynamoDB</text>

    <!-- Tag 4: S3 -->
    <rect x="130" y="142" width="74" height="26" rx="13" fill="#1e293b" />
    <circle cx="142" cy="155" r="4" fill="#4ade80" />
    <text x="152" y="159" class="sans tag-txt" fill="#f8fafc">S3</text>

    <!-- Tag 5: AWS CDK -->
    <rect x="18" y="176" width="94" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="189" r="4" fill="#f43f5e" />
    <text x="40" y="193" class="sans tag-txt" fill="#f8fafc">AWS CDK</text>

    <!-- Tag 6: EventBridge -->
    <rect x="120" y="176" width="88" height="26" rx="13" fill="#1e293b" />
    <circle cx="132" cy="189" r="4" fill="#fbbf24" />
    <text x="142" y="193" class="sans tag-txt" fill="#f8fafc">Events</text>
  </g>

  <!-- Card 3: Containers & Native -->
  <g transform="translate(486, 8)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="224" height="232" rx="20" fill="#0b0b0d" stroke="url(#rim-stack)" stroke-width="1.2" />
    
    <text x="18" y="32" class="mono stack-sub">03 // ARCHITECTURE</text>
    <text x="18" y="56" class="sans stack-title">Containers &amp; Native</text>

    <rect x="18" y="74" width="86" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="87" r="4" fill="#38bdf8" />
    <text x="40" y="91" class="sans tag-txt" fill="#f8fafc">Docker</text>

    <rect x="112" y="74" width="94" height="26" rx="13" fill="#1e293b" />
    <circle cx="124" cy="87" r="4" fill="#60a5fa" />
    <text x="134" y="91" class="sans tag-txt" fill="#f8fafc">SwiftUI</text>

    <rect x="18" y="108" width="114" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="121" r="4" fill="#3b82f6" />
    <text x="40" y="125" class="sans tag-txt" fill="#f8fafc">Kubernetes</text>

    <rect x="140" y="108" width="68" height="26" rx="13" fill="#1e293b" />
    <circle cx="152" cy="121" r="4" fill="#38bdf8" />
    <text x="162" y="125" class="sans tag-txt" fill="#f8fafc">React</text>

    <rect x="18" y="142" width="102" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="155" r="4" fill="#a855f7" />
    <text x="40" y="159" class="sans tag-txt" fill="#f8fafc">Terraform</text>

    <rect x="128" y="142" width="80" height="26" rx="13" fill="#1e293b" />
    <circle cx="140" cy="155" r="4" fill="#0284c7" />
    <text x="150" y="159" class="sans tag-txt" fill="#f8fafc">Flutter</text>

    <rect x="18" y="176" width="94" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="189" r="4" fill="#ef4444" />
    <text x="40" y="193" class="sans tag-txt" fill="#f8fafc">Ansible</text>

    <rect x="120" y="176" width="88" height="26" rx="13" fill="#1e293b" />
    <circle cx="132" cy="189" r="4" fill="#fbbf24" />
    <text x="142" y="193" class="sans tag-txt" fill="#f8fafc">Chrome</text>
  </g>

  <!-- Card 4: Observability & SRE -->
  <g transform="translate(724, 8)" filter="url(#stack-shadow)">
    <rect x="0" y="0" width="224" height="232" rx="20" fill="#0b0b0d" stroke="url(#rim-stack)" stroke-width="1.2" />
    
    <text x="18" y="32" class="mono stack-sub">04 // RELIABILITY</text>
    <text x="18" y="56" class="sans stack-title">Observability &amp; Ops</text>

    <rect x="18" y="74" width="116" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="87" r="4" fill="#f43f5e" />
    <text x="40" y="91" class="sans tag-txt" fill="#f8fafc">CloudWatch</text>

    <rect x="18" y="108" width="112" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="121" r="4" fill="#f97316" />
    <text x="40" y="125" class="sans tag-txt" fill="#f8fafc">Prometheus</text>

    <rect x="138" y="108" width="70" height="26" rx="13" fill="#1e293b" />
    <circle cx="150" cy="121" r="4" fill="#fb923c" />
    <text x="160" y="125" class="sans tag-txt" fill="#f8fafc">Argo</text>

    <rect x="18" y="142" width="94" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="155" r="4" fill="#ea580c" />
    <text x="40" y="159" class="sans tag-txt" fill="#f8fafc">Grafana</text>

    <rect x="120" y="142" width="88" height="26" rx="13" fill="#1e293b" />
    <circle cx="132" cy="155" r="4" fill="#3b82f6" />
    <text x="142" y="159" class="sans tag-txt" fill="#f8fafc">Actions</text>

    <rect x="18" y="176" width="118" height="26" rx="13" fill="#1e293b" />
    <circle cx="30" cy="189" r="4" fill="#10b981" />
    <text x="40" y="193" class="sans tag-txt" fill="#f8fafc">Incident Ops</text>
  </g>
</svg>
